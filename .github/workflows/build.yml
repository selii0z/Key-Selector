name: Build Key Selector
on:
  push:
    branches: [develop/key-selector-1.0, main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile
        shell: bash
        run: gradle build --stacktrace --console=plain 2>&1 | tee build-output.txt
      - name: Report diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f build-output.txt; then
            tail -c 40000 build-output.txt > diagnostic.txt
          else
            echo "Failure before Gradle execution" > diagnostic.txt
          fi
          gh issue create --title "Build diagnostic ${{ github.run_id }}" --body-file diagnostic.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Key-Selector
          path: build/libs/*.jar
          if-no-files-found: error
